name: Build and checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Shared interface syntax and catalogs
        shell: pwsh
        run: |
          node md-reader/build-locales.mjs --native yue-windows/src/Translations.cs
          npm --prefix md-reader run check
      - name: Build Windows and run native boundary checks
        shell: pwsh
        run: |
          Set-Location yue-windows
          node fetch-sdk.mjs
          Expand-Archive -LiteralPath vendor/webview2.zip -DestinationPath vendor/webview2 -Force
          ./build.ps1
          ./tests/SigningTests.ps1
      - name: Browser storage and startup regressions
        shell: pwsh
        run: |
          npm --prefix md-reader install --ignore-scripts
          if ($LASTEXITCODE -ne 0) { throw 'Test dependency installation failed.' }
          $server = Start-Process node -ArgumentList 'md-reader/serve.mjs' -WindowStyle Hidden -PassThru
          try {
            $ready = $false
            foreach ($attempt in 1..30) {
              try { Invoke-WebRequest http://127.0.0.1:4173/ -UseBasicParsing | Out-Null; $ready = $true; break } catch { Start-Sleep -Milliseconds 200 }
            }
            if (-not $ready) { throw 'Preview server did not start.' }
            foreach ($test in @('startup','highlights','localization')) {
              node "md-reader/tests/$test.test.cjs"
              if ($LASTEXITCODE -ne 0) { throw "$test checks failed." }
            }
          } finally { if (-not $server.HasExited) { Stop-Process -Id $server.Id } }
